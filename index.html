<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" loop src="bdsong.m4a"></audio>

    <canvas id="matrix"></canvas>

    <div class="container">
        <!-- Step 1: Countdown -->
        <div id="text-screen" class="screen active">
            <h1 id="display-text">3</h1>
        </div>

        <!-- Step 2: Sticker Button -->
        <div id="heart-screen" class="screen">
            <img src="giphy.gif" class="sticker-btn" onclick="goToMainPage()" alt="Sticker Button">
        </div>

        <!-- Step 3: Galaxy Book & Heart Gallery Page -->
        <div id="main-screen" class="screen">
            <div id="wish-box" class="wish-box">
                <p id="wish-text">✨ Tap the book to flip ✨</p>
            </div>

            <!-- Custom Pure CSS 3D Book -->
            <div class="book-container" id="book-container" onclick="flipNextPage()">
                <div class="book" id="my-book">
                    <!-- Page 0 -->
                    <div class="book-page" id="page-0">
                        <div class="page-front">
                            <img src="cover.jpg" alt="Cover">
                        </div>
                        <div class="page-back">
                            <img src="mygirl2.jpg" alt="Photo 2">
                        </div>
                    </div>

                    <!-- Page 1 -->
                    <div class="book-page" id="page-1">
                        <div class="page-front">
                            <img src="mygirl3.jpg" alt="Photo 3">
                        </div>
                        <div class="page-back">
                            <img src="mygirl4.jpg" alt="Photo 4">
                        </div>
                    </div>

                    <!-- Page 2 -->
                    <div class="book-page" id="page-2">
                        <div class="page-front">
                            <img src="mygirl.jpg" alt="Photo 5">
                        </div>
                        <div class="page-back">
                            <img src="back.jpg" alt="Back Cover">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Heart Gallery Container -->
            <div class="heart-gallery" id="heart-gallery"></div>

            <!-- 1. အသည်းပုံ Page ၏ အောက်နားတွင် ပေါ်မည့် စာသား -->
            <div class="wish-instruction">
                <p>Listen till the end and make a wish ✨</p>
            </div>

            <!-- 2. စက္ကန့် ၈၅ ပြည့်မှ ပေါ်မည့် Sticker -->
            <div id="secret-sticker-btn" class="sticker-container" style="display: none;" onclick="goToNextPage()">
                <img src="giphy1.gif" alt="Make a Wish Sticker">
            </div>
        </div>
    </div>

    <!-- Embedded Complete Logic Script -->
    <script>
        // 1. Matrix Background Effect
        const canvas = document.getElementById('matrix');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const fontSize = 10;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0F0';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(drawMatrix, 33);
        }

        // 2. Countdown Logic (3 -> 2 -> 1 -> Step 2)
        let count = 3;
        const displayElement = document.getElementById("display-text");
        
        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                if (displayElement) displayElement.textContent = count;
            } else {
                clearInterval(timer);
                // Countdown ပြီးရင် Step 1 ကို ဖျောက်ပြီး Step 2 (Heart Screen) ကို ပြမည်
                const textScreen = document.getElementById("text-screen");
                const heartScreen = document.getElementById("heart-screen");
                if (textScreen) textScreen.classList.remove("active");
                if (heartScreen) heartScreen.classList.add("active");
                
                // သီချင်း ဖွင့်မည်
                const music = document.getElementById("bg-music");
                if (music) { music.play().catch(() => {}); }
            }
        }, 1000);

        // 3. Sticker ကို နှိပ်ရင် Main Page သို့ သွားမည်
        function goToMainPage() {
            const heartScreen = document.getElementById("heart-screen");
            const mainScreen = document.getElementById("main-screen");
            if (heartScreen) heartScreen.classList.remove("active");
            if (mainScreen) mainScreen.classList.add("active");
        }

        // 4. Book Flip Logic
        let currentPage = 0;
        function flipNextPage() {
            const pages = document.querySelectorAll('.book-page');
            if (currentPage < pages.length) {
                pages[currentPage].style.transform = 'rotateY(-180deg)';
                currentPage++;
            }
        }

        // 5. စက္ကန့် ၈၅ ပြည့်လျှင် Sticker ကို ဖော်ပေးမည်
        setTimeout(function() {
            const stickerBtn = document.getElementById("secret-sticker-btn");
            if (stickerBtn) {
                stickerBtn.style.display = "block";
            }
        }, 85000); 

        // 6. Sticker ကို နှိပ်လျှင် နောက် Page (final.html) သို့ သွားမည်
        function goToNextPage() {
            window.location.href = "final.html"; 
        }
    </script>
</body>
</html>
